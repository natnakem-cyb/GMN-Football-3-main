name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r training/requirements.txt

      - name: TypeScript lint
        run: npm run lint

      - name: Scenario validation tests
        run: npm run test:scenarios

      - name: Determinism tests
        run: npm run test:determinism

      - name: GAE bootstrap regression tests
        run: python training/test_gae_bootstrap.py

      - name: Evaluation cache identity tests
        run: python training/test_eval_cache_identity.py
